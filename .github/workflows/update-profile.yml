name: Update profile README

# Rebuilds the project tables in profile/README.md from the organization's public
# repositories (scripts/update_profile.py) and commits the result when it changed.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, profile/README.md, .github/workflows/update-profile.yml]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test the generator
        run: python -m unittest discover -s tests -v
      - name: Rebuild the README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit when it changed
        run: |
          if git diff --quiet -- profile/README.md; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh the project list" -- profile/README.md
          git push
